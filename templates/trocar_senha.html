{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width:420px">
  <div class="card" style="margin-top:40px">
    <div class="card-title">🔒 Troca de Senha Obrigatória</div>
    <div class="alerta alerta-aviso" style="margin-bottom:16px">
      Por segurança, você precisa definir uma nova senha antes de continuar.
    </div>
    {% for e in erros %}<div class="alerta alerta-erro">{{ e }}</div>{% endfor %}
    <form method="POST">
      <div class="form-group">
        <label for="nova_senha">Nova Senha *</label>
        <input type="password" id="nova_senha" name="nova_senha" placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>
      <div class="form-group">
        <label for="confirmar_senha">Confirmar Nova Senha *</label>
        <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Repita a nova senha" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Salvar Nova Senha</button>
    </form>
  </div>
</div>
{% endblock %}
