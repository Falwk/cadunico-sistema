<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{{ doc.titulo }} — Impressão PDF CadÚnico</title>
  <style>
    @page {
      size: A4;
      margin: 20mm 15mm;
    }
    body {
      font-family: 'Arial', sans-serif;
      font-size: 11pt;
      line-height: 1.6;
      color: #0F172A;
      margin: 0;
      padding: 0;
      background: #FFFFFF;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
    }
    td, th {
      border: 1px solid #94A3B8;
      padding: 8px 10px;
    }
  </style>
</head>
<body onload="window.print()">
  {{ doc.conteudo_html|safe }}
</body>
</html>
