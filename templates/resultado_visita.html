{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width:700px">
  <div class="flex" style="margin-bottom:20px;flex-wrap:wrap;gap:10px">
    <h1 class="page-title mb-0">Registrar Resultado da Visita</h1>
    <a href="{{ url_for('detalhe_visita', visita_id=visita.id) }}"
       class="btn btn-outline btn-sm" style="margin-left:auto">← Voltar</a>
  </div>

  <div class="card" style="margin-bottom:16px;padding:14px 20px;background:var(--cinza)">
    <strong>{{ visita.numero_vd or ('#' + visita.id|string) }}</strong>
    &nbsp;·&nbsp; {{ visita.nome_rf }}
    &nbsp;·&nbsp; CPF: {{ visita.cpf_rf }}
  </div>

  {% for e in erros %}<div class="alerta alerta-erro">{{ e }}</div>{% endfor %}

  <form method="POST" enctype="multipart/form-data" novalidate>
    <div class="card">
      <div class="card-title">Resultado da Visita</div>

      <div class="form-group">
        <label for="data_realizada">Data de Realização *</label>
        <input type="date" id="data_realizada" name="data_realizada"
               max="{{ hoje }}" value="{{ request.form.get('data_realizada', '') }}" required>
      </div>

      <div class="form-group">
        <label for="observacoes">Observações do Entrevistador
          <span class="text-muted">(opcional)</span></label>
        <textarea id="observacoes" name="observacoes" rows="4"
                  placeholder="Descreva o resultado e as condições encontradas…">{{ request.form.get('observacoes', '') }}</textarea>
      </div>

      <div class="form-group">
        <label for="parecer_as">Parecer da Assistente Social
          <span class="text-muted">(opcional — somente PDF, máx. 20 MB)</span></label>
        <input type="file" id="parecer_as" name="parecer_as" accept=".pdf"
               style="padding:8px 0">
      </div>
    </div>

    <div class="flex" style="gap:12px">
      <a href="{{ url_for('detalhe_visita', visita_id=visita.id) }}"
         class="btn btn-outline">Cancelar</a>
      <button type="submit" class="btn btn-primary" style="margin-left:auto">
        ✅ Salvar Resultado
      </button>
    </div>
  </form>
</div>
{% endblock %}
