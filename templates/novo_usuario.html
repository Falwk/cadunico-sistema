{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width:520px">
  <h1 class="page-title">Novo Usuário</h1>
  {% for e in erros %}<div class="alerta alerta-erro">{{ e }}</div>{% endfor %}
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label>Nome completo *</label>
        <input type="text" name="nome" value="{{ form.get('nome','') }}" required>
      </div>
      <div class="form-group">
        <label>Login *</label>
        <input type="text" name="login" value="{{ form.get('login','') }}" required>
      </div>
      <div class="form-group">
        <label>Senha *</label>
        <input type="password" name="senha" required>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-group">
          <label>Perfil</label>
          <select name="perfil">
            <option value="entrevistador" {% if form.get('perfil','entrevistador')=='entrevistador' %}selected{% endif %}>Entrevistador</option>
            <option value="assistente_social" {% if form.get('perfil')=='assistente_social' %}selected{% endif %}>Assistente Social</option>
            <option value="admin" {% if form.get('perfil')=='admin' %}selected{% endif %}>Administrador</option>
          </select>
        </div>
        <div class="form-group">
          <label>Unidade / Polo *</label>
          <select name="unidade">
            <option value="Tomé-Açu (Sede)" {% if form.get('unidade','Tomé-Açu (Sede)')=='Tomé-Açu (Sede)' %}selected{% endif %}>Tomé-Açu (Sede)</option>
            <option value="Quatro Bocas" {% if form.get('unidade')=='Quatro Bocas' %}selected{% endif %}>Quatro Bocas</option>
          </select>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-group">
          <label>E-mail <span class="text-muted">(recuperação de senha)</span></label>
          <input type="email" name="email" value="{{ form.get('email','') }}" placeholder="email@exemplo.com">
        </div>
        <div class="form-group">
          <label>WhatsApp <span class="text-muted">(com DDD)</span></label>
          <input type="text" name="telefone" value="{{ form.get('telefone','') }}" placeholder="91912345678" maxlength="20">
        </div>
      </div>
      <div class="form-group">
        <label class="check-item" style="display:flex">
          <input type="checkbox" name="acesso_sibec" {% if form.get('acesso_sibec') %}checked{% endif %}>
          <span>Acesso ao SIBEC (Consulta SIBEC e Folha de Pagamento)</span>
        </label>
      </div>
      <hr class="divider">
      <div class="flex">
        <a href="{{ url_for('admin_usuarios') }}" class="btn btn-outline">Cancelar</a>
        <button type="submit" class="btn btn-primary" style="margin-left:auto">Criar Usuário</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
