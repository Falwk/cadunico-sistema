services:
  - type: web
    name: cadunico-sistema
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: CADUNICO_SECRET
        value: CadUnico@TomeAcu2026!Prefeitura
      - key: DATABASE_URL
        fromDatabase:
          name: cadunico-db
          property: connectionString

databases:
  - name: cadunico-db
    plan: free
    databaseName: cadunico
    user: cadunico
